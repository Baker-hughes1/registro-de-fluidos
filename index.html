<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Matriz de seguimiento pozos</title>
<style>
:root{
  --bg:#f2f6f5; --bg-elev:#ffffff; --bg-sunken:#e8f0ee;
  --text:#111c1a; --text-dim:#526462; --text-faint:#84928f;
  --border:#dbe6e3; --border-strong:#bdccc8;
  --accent:#1a9c7e; --accent-strong:#0f7d64; --accent-soft:#e0f5ee;
  --warn:#c07a17; --warn-soft:#fdf2e0;
  --danger:#c23b3b; --danger-soft:#fbe9e9;
  --ok:#1a9c7e; --ok-soft:#e0f5ee;
  --shadow: 0 1px 2px rgba(10,30,26,.06), 0 4px 14px rgba(10,30,26,.07);
  --radius: 14px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  /* Baker Hughes brand tokens */
  --brand-900:#0e2422; --brand-800:#173c37; --brand-700:#215750; --brand-600:#2e6f66;
  --brand-green:#53c79e; --brand-green-strong:#33a67d; --brand-green-glow:rgba(83,199,158,.35);
  --brand-navy-line:#12302c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1614; --bg-elev:#16211f; --bg-sunken:#0a1210;
    --text:#eaf3f0; --text-dim:#a3b6b1; --text-faint:#6d8580;
    --border:#233531; --border-strong:#344c46;
    --accent:#4fd7ab; --accent-strong:#79e8c3; --accent-soft:#14332b;
    --warn:#e0a53d; --warn-soft:#2e2410;
    --danger:#e2685f; --danger-soft:#301616;
    --ok:#4fd7ab; --ok-soft:#12332a;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1614; --bg-elev:#16211f; --bg-sunken:#0a1210;
  --text:#eaf3f0; --text-dim:#a3b6b1; --text-faint:#6d8580;
  --border:#233531; --border-strong:#344c46;
  --accent:#4fd7ab; --accent-strong:#79e8c3; --accent-soft:#14332b;
  --warn:#e0a53d; --warn-soft:#2e2410;
  --danger:#e2685f; --danger-soft:#301616;
  --ok:#4fd7ab; --ok-soft:#12332a;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
.app{max-width:920px;margin:0 auto;padding:0 0 90px 0;min-height:100vh;}
/* header */
.topbar{
  position:sticky; top:0; z-index:40;
  background:
    radial-gradient(120% 180% at 85% -20%, rgba(83,199,158,.35), transparent 55%),
    linear-gradient(155deg, var(--brand-900) 0%, var(--brand-800) 45%, var(--brand-700) 100%);
  padding:16px 16px 0 16px; overflow:hidden; position:sticky;
}
.topbar-waves{position:absolute; left:0; right:0; bottom:0; height:64px; opacity:.55; pointer-events:none;}
.topbar-row{display:flex; align-items:center; gap:11px; margin-bottom:14px; position:relative; z-index:1;}
.logo{
  width:40px;height:40px;border-radius:11px; flex-shrink:0; position:relative;
  background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;
  box-shadow: 0 2px 14px rgba(0,0,0,.25);
}
.logo svg{width:24px;height:24px;display:block;}
.brand-badge{
  background:#ffffff; border-radius:10px; padding:4px 10px; flex-shrink:0;
  display:flex; align-items:center; box-shadow:0 3px 12px rgba(0,0,0,.22);
}
.brand-badge img{height:52px; width:auto; display:block;}
@media(min-width:480px){ .brand-badge img{height:60px;} }
.title-block{min-width:0;}
.title-block h1{font-size:15.5px;margin:0;font-weight:800;letter-spacing:.15px;line-height:1.25;color:#fff;}
.title-block p{margin:2px 0 0 0;font-size:11.5px;color:rgba(255,255,255,.62);}
.conn-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);flex-shrink:0;}
.conn-dot.on{background:var(--brand-green);box-shadow:0 0 0 3px var(--brand-green-glow);}
.conn-dot.off{background:var(--warn);box-shadow:0 0 0 3px rgba(224,165,61,.3);}
.tabs{display:flex; gap:4px; position:relative; z-index:1; background:rgba(0,0,0,.18); padding:4px; border-radius:12px 12px 0 0; border-bottom:none;}
.tab-btn{
  flex:1; padding:10px 4px; text-align:center; font-size:13px; font-weight:700;
  background:none; border:none; color:rgba(255,255,255,.55); cursor:pointer;
  border-radius:9px; transition:.15s;
}
.tab-btn.active{color:var(--brand-900); background:var(--brand-green);}

.wrap{padding:16px;}
.hidden{display:none !important;}

/* stepper */
.stepper{display:flex; align-items:center; margin-bottom:18px; gap:2px;}
.step-node{display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; cursor:pointer;}
.step-circle{
  width:30px;height:30px;border-radius:50%;background:var(--bg-sunken); border:2px solid var(--border-strong);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--text-faint);
  transition:.2s;
}
.step-node.done .step-circle{background:var(--accent); border-color:var(--accent); color:#fff;}
.step-node.active .step-circle{border-color:var(--accent); color:var(--accent-strong); background:var(--accent-soft);}
.step-label{font-size:10px; color:var(--text-faint); text-align:center; font-weight:600;}
.step-node.active .step-label{color:var(--accent-strong);}
.step-line{flex:0.6; height:2px; background:var(--border-strong); margin-top:-20px;}
.step-line.done{background:var(--accent);}

/* cards */
.card{
  background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; box-shadow:var(--shadow); margin-bottom:14px;
}
.card h2{font-size:15px;margin:0 0 4px 0;}
.card .sub{font-size:12.5px;color:var(--text-faint);margin:0 0 14px 0;}

/* client / pozo grid */
.grid-select{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px;}
.pick-card{
  border:1.5px solid var(--border); border-radius:12px; padding:14px 10px; text-align:center;
  cursor:pointer; background:var(--bg-elev); transition:.15s; display:flex; flex-direction:column; align-items:center; gap:8px;
}
.pick-card:active{transform:scale(.97);}
.pick-card:hover{border-color:var(--accent);}
.pick-avatar{
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:15px;color:#fff;
}
.pick-name{font-size:12.5px;font-weight:700;line-height:1.2;}
.pick-meta{font-size:10.5px;color:var(--text-faint);}

.search-box{
  width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--border);
  background:var(--bg-sunken); color:var(--text); font-size:14px; margin-bottom:12px;
}
.search-box:focus{outline:none; border-color:var(--accent);}

.pozo-list{display:flex; flex-direction:column; gap:8px; max-height:52vh; overflow-y:auto;}
.pozo-item{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 14px; border:1.5px solid var(--border); border-radius:10px; cursor:pointer; background:var(--bg-elev);
}
.pozo-item:active{transform:scale(.985);}
.pozo-item:hover{border-color:var(--accent);}
.pozo-item .name{font-size:13.5px; font-weight:600;}
.pozo-item .arrow{color:var(--text-faint);}

.chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.chip{
  display:flex; align-items:center; gap:6px; background:var(--accent-soft); color:var(--accent-strong);
  padding:6px 12px; border-radius:20px; font-size:12.5px; font-weight:700;
}
.chip button{background:none;border:none;color:inherit;cursor:pointer;font-size:13px;padding:0;line-height:1;opacity:.7;}

.back-link{
  display:inline-flex; align-items:center; gap:5px; background:none; border:none; color:var(--text-dim);
  font-size:13px; font-weight:600; cursor:pointer; padding:6px 0; margin-bottom:6px;
}

/* accordion */
.accordion-section{border:1px solid var(--border); border-radius:12px; margin-bottom:10px; overflow:hidden; background:var(--bg-elev);}
.accordion-head{
  display:flex; align-items:center; justify-content:space-between; padding:13px 14px; cursor:pointer; gap:10px;
}
.accordion-head .left{display:flex; align-items:center; gap:10px; min-width:0;}
.accordion-head .icon{font-size:18px;}
.accordion-head .name{font-size:13.5px; font-weight:700;}
.accordion-head .count{font-size:11px; color:var(--text-faint); font-weight:600;}
.accordion-head .chevron{transition:.2s; color:var(--text-faint); font-size:12px;}
.accordion-section.open .chevron{transform:rotate(180deg);}
.accordion-body{padding:0 14px 14px 14px; display:none;}
.accordion-section.open .accordion-body{display:block;}
.progress-pill{
  height:5px; border-radius:3px; background:var(--border); width:56px; overflow:hidden; flex-shrink:0;
}
.progress-pill > div{height:100%; background:var(--accent); border-radius:3px;}

.field-row{margin-bottom:12px;}
.field-row label{
  display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:5px;
}
.field-row input, .field-row select{
  width:100%; padding:10px 11px; border-radius:9px; border:1.5px solid var(--border);
  background:var(--bg-sunken); color:var(--text); font-size:14.5px; font-family:inherit;
}
.field-row input:focus, .field-row select:focus{outline:none; border-color:var(--accent);}
.field-row input[readonly]{background:var(--accent-soft); color:var(--accent-strong); font-weight:700; border-style:dashed;}
.calc-badge{
  font-size:9.5px; background:var(--accent); color:#fff; padding:1px 6px; border-radius:6px; font-weight:700; letter-spacing:.3px;
}
.field-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 12px;}
@media(min-width:560px){ .field-grid{grid-template-columns:1fr 1fr 1fr;} }
.field-grid .field-row.full{grid-column:1/-1;}

.formula-note{font-size:11px; color:var(--text-faint); margin:-4px 0 12px 0; font-style:italic;}

/* buttons */
.btn{
  border:none; border-radius:11px; padding:13px 18px; font-size:14.5px; font-weight:700; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:.15s; font-family:inherit;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:linear-gradient(135deg,var(--accent-strong),var(--accent)); color:#fff; box-shadow:0 3px 14px rgba(26,156,126,.35);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-ghost{background:var(--bg-sunken); color:var(--text);}
.btn-danger{background:var(--danger-soft); color:var(--danger);}
.btn-block{width:100%;}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn-row{display:flex; gap:10px; margin-top:16px;}
.btn-row .btn{flex:1;}

/* review */
.review-section{margin-bottom:16px;}
.review-section h3{font-size:12.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-faint); margin:0 0 8px 0;}
.review-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 14px;}
.review-item{font-size:13px; border-bottom:1px dashed var(--border); padding-bottom:6px;}
.review-item .l{color:var(--text-faint); font-size:11px; display:block;}
.review-item .v{font-weight:700;}
.empty-note{font-size:12.5px; color:var(--text-faint); padding:20px 0; text-align:center;}

/* banners */
.banner{
  display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:11px; font-size:13px; margin-bottom:14px;
}
.banner-warn{background:var(--warn-soft); color:var(--warn);}
.banner-ok{background:var(--ok-soft); color:var(--ok);}
.banner button{margin-left:auto; background:none; border:1.5px solid currentColor; color:inherit; border-radius:7px; padding:5px 10px; font-size:11.5px; font-weight:700; cursor:pointer;}

/* toast */
#toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(100px); z-index:100;
  background:var(--text); color:var(--bg); padding:12px 20px; border-radius:11px; font-size:13.5px; font-weight:600;
  box-shadow:var(--shadow); transition:.25s; opacity:0; display:flex; align-items:center; gap:8px; max-width:90vw;
}
:root[data-theme="dark"] #toast, @media (prefers-color-scheme:dark){ }
#toast.show{transform:translateX(-50%) translateY(0); opacity:1;}
#toast.ok{background:var(--ok);color:#fff;}
#toast.err{background:var(--danger);color:#fff;}

/* historial */
.filters-card{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px;}
.filters-card select, .filters-card input{
  padding:9px 10px; border-radius:9px; border:1.5px solid var(--border); background:var(--bg-sunken); color:var(--text); font-size:13px;
}
.filters-card .grow{flex:1; min-width:130px;}
.record-card{
  border:1px solid var(--border); border-radius:12px; padding:13px 14px; margin-bottom:10px; background:var(--bg-elev);
}
.record-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px;}
.record-top .pozo{font-size:14px; font-weight:800;}
.record-top .cliente{font-size:11.5px; color:var(--text-faint); font-weight:700;}
.record-date{font-size:11.5px; color:var(--text-dim); background:var(--bg-sunken); padding:3px 9px; border-radius:8px; white-space:nowrap;}
.record-mini{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px;}
.record-mini div{font-size:11.5px;}
.record-mini .l{color:var(--text-faint); display:block; font-size:10px;}
.record-mini .v{font-weight:700;}
.record-actions{display:flex; gap:8px;}
.record-actions .btn{padding:8px 12px; font-size:12px; flex:none;}

/* modal */
.modal-bg{
  position:fixed; inset:0; background:rgba(10,14,20,.55); z-index:80; display:flex; align-items:flex-end; justify-content:center;
}
@media(min-width:640px){ .modal-bg{align-items:center;} }
.modal{
  background:var(--bg-elev); width:100%; max-width:620px; max-height:86vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:18px;
}
@media(min-width:640px){ .modal{border-radius:18px;} }
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.modal-head h2{font-size:16px; margin:0;}
.modal-close{background:var(--bg-sunken); border:none; width:30px; height:30px; border-radius:50%; font-size:15px; cursor:pointer; color:var(--text);}

.fab-export{
  position:fixed; bottom:20px; right:16px; z-index:30;
}

::-webkit-scrollbar{width:6px; height:6px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:3px;}

/* dashboard */
.kpi-row{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:16px;}
@media(min-width:560px){ .kpi-row{grid-template-columns:repeat(4,1fr);} }
.kpi-card{
  background:var(--bg-elev); border:1px solid var(--border); border-radius:12px; padding:14px;
  box-shadow:var(--shadow);
}
.kpi-card .val{font-size:22px; font-weight:800; color:var(--accent-strong); line-height:1.1;}
.kpi-card .lbl{font-size:11px; color:var(--text-faint); font-weight:700; margin-top:4px; text-transform:uppercase; letter-spacing:.3px;}
.chip-select{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
.chip-btn{
  padding:7px 13px; border-radius:20px; border:1.5px solid var(--border); background:var(--bg-sunken);
  color:var(--text-dim); font-size:12px; font-weight:700; cursor:pointer; transition:.15s;
}
.chip-btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.chart-wrap{position:relative; height:460px; margin-bottom:6px;}
.dash-filters label{display:flex; flex-direction:column; gap:4px; font-size:11px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.3px; min-width:130px;}
.dash-filters label select, .dash-filters label input{text-transform:none; letter-spacing:0; font-weight:600; width:100%;}
.dash-filters .dash-clear{align-self:flex-end; padding:9px 14px; font-size:12.5px;}
.dash-select{
  width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid var(--border);
  background:var(--bg-sunken); color:var(--text); font-size:14px; margin-bottom:16px; font-weight:600;
}
.legend-note{font-size:11px; color:var(--text-faint); margin-top:6px; display:flex; gap:14px; flex-wrap:wrap;}
.legend-dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle;}

.title-block p{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.topbar.topbar-notabs{padding-bottom:6px;}
.logout-btn{
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25); color:#fff;
  border-radius:9px; padding:7px 11px; font-size:12px; font-weight:700; cursor:pointer; flex-shrink:0;
}
.logout-btn:active{transform:scale(.96);}
</style>
</head>

    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var DRAFT_KEY = 'captura_pozos_draft_v1';

function saveDraft(){
  try{
    var snap = {cliente:STATE.cliente, pozo:STATE.pozo, values:STATE.values, step:STATE.step, ts:Date.now()};
    localStorage.setItem(DRAFT_KEY, JSON.stringify(snap));
  }catch(e){}
}
function loadDraft(){
  try{
    var raw = localStorage.getItem(DRAFT_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function clearDraft(){
  try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
}

var cap = { ready:false, connected:false };
var HIST_POLL_TIMER = null;

function initCapabilities(){
  cap.ready = true;
  cap.connected = !!supabase;
  if(!supabase){
    // Modo local (Supabase sin configurar): sin login, rol administrador solo en este equipo.
    STATE.user = {email:'local', role:'admin'};
    STATE.authReady = true;
    renderAll();
    return;
  }
  supabase.auth.getSession().then(function(res){
    applySession(res && res.data ? res.data.session : null);
    STATE.authReady = true;
    renderAll();
  }).catch(function(){
    STATE.authReady = true;
    renderAll();
  });
  supabase.auth.onAuthStateChange(function(event){
    if(event==='SIGNED_OUT'){ applySession(null); renderAll(); }
  });
  HIST_POLL_TIMER = setInterval(function(){
    if(STATE.user && (STATE.tab==='historial' || STATE.tab==='dashboard')) subscribeHistorial();
  }, 15000); // refresco cada 15s para reflejar cambios de otros dispositivos
}

/* ---------------- sesión y roles ---------------- */
function roleLabel(r){ return r==='admin' ? 'Administrador' : (r==='captura' ? 'Captura' : 'Sin rol'); }
function isAdmin(){ return !!(STATE.user && STATE.user.role==='admin'); }
function hasRole(){ return !!(STATE.user && (STATE.user.role==='admin' || STATE.user.role==='captura')); }

function applySession(session){
  if(session && session.user){
    var meta = session.user.app_metadata || {};
    STATE.user = {email: session.user.email, role: meta.role || null};
    if(STATE.tab==='dashboard' && STATE.user.role!=='admin') STATE.tab = 'captura';
    if(hasRole()) subscribeHistorial();
  } else {
    STATE.user = null;
    STATE.hist.records = [];
  }
}

function doLogin(){
  var emailEl = document.getElementById('login-email');
  var passEl = document.getElementById('login-pass');
  var email = emailEl ? emailEl.value.trim() : '';
  var pass = passEl ? passEl.value : '';
  if(!email || !pass){
    STATE.loginError = 'Ingresa tu correo y contraseña.';
    STATE.loginEmail = email;
    renderAll();
    return;
  }
  var btn = document.getElementById('login-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Ingresando…'; }
  supabase.auth.signInWithPassword({email:email, password:pass}).then(function(res){
    if(res.error){
      STATE.loginError = 'Correo o contraseña incorrectos.';
      STATE.loginEmail = email;
      renderAll();
      return;
    }
    STATE.loginError = ''; STATE.loginEmail = '';
    applySession(res.data.session);
    renderAll();
  }).catch(function(){
    STATE.loginError = 'No se pudo conectar. Revisa tu conexión e inténtalo de nuevo.';
    STATE.loginEmail = email;
    renderAll();
  });
}

function doLogout(){
  clearDraft();
  if(!supabase) return;
  supabase.auth.signOut().then(function(){
    applySession(null);
    STATE.tab = 'captura';
    resetWizard();
    renderAll();
  });
}

/* ---------------- calc formulas ---------------- */
function recalc(){
  var r6 = parseFloat(STATE.values.r6), r3 = parseFloat(STATE.values.r3);
  var r600 = parseFloat(STATE.values.r600), r300 = parseFloat(STATE.values.r300);
  if(!STATE.calcOverride.ys_yield_stress && !isNaN(r6) && !isNaN(r3)){
    STATE.values.ys_yield_stress = round2(2*r3 - r6);
  }
  if(!STATE.calcOverride.pv_plastic_viscosity && !isNaN(r600) && !isNaN(r300)){
    STATE.values.pv_plastic_viscosity = round2(r600 - r300);
  }
  var pv = parseFloat(STATE.values.pv_plastic_viscosity);
  if(!STATE.calcOverride.yp_yield_point && !isNaN(r300) && !isNaN(pv)){
    STATE.values.yp_yield_point = round2(r300 - pv);
  }
}
function round2(n){ return Math.round(n*100)/100; }

/* ---------------- rendering ---------------- */
var root = document.getElementById('root');

function renderAll(){
  var body;
  if(!cap.ready || !STATE.authReady){
    body = '<div class="empty-note">Cargando…</div>';
  } else if(!STATE.user){
    body = renderLogin();
  } else if(!hasRole()){
    body = renderNoRole();
  } else {
    if(STATE.tab==='dashboard' && !isAdmin()) STATE.tab = 'captura';
    if(STATE.tab==='captura') body = renderCaptura();
    else if(STATE.tab==='historial') body = renderHistorial();
    else body = renderDashboard();
  }
  root.innerHTML = renderTopbar() + '<div class="app"><div class="wrap">' + body + '</div></div>';
  attachEvents();
  if(STATE.user && hasRole() && STATE.tab==='dashboard') renderDashboardCharts();
}

    '<h2>Iniciar sesión</h2>' +
    '<p class="sub">Ingresa con el usuario asignado para acceder al aplicativo.</p>' +
    (STATE.loginError ? '<div class="banner banner-warn">⚠️ '+esc(STATE.loginError)+'</div>' : '') +
    '<div class="field-row"><label>Correo</label><input type="email" id="login-email" autocomplete="username" inputmode="email" value="'+esc(STATE.loginEmail||'')+'"></div>' +
    '<div class="field-row"><label>Contraseña</label><input type="password" id="login-pass" autocomplete="current-password"></div>' +
    '<button class="btn btn-primary btn-block" id="login-btn" data-action="login">Ingresar</button>' +
  '</div>';
}

function renderTopbar(){
  var connClass = !cap.ready ? '' : (cap.connected ? 'on' : 'off');
  var connTitle = !cap.ready ? 'Conectando…' : (cap.connected ? 'Conectado a la base de datos' : 'Sin configurar / sin conexión — revisa SUPABASE_URL y SUPABASE_ANON_KEY');
  var logged = !!STATE.user;
  var remote = logged && STATE.user.email!=='local';
  var sub = remote ? ('Drilling and Completions Fluids · '+roleLabel(STATE.user.role)) : 'Reporte diario de lodos · Colombia';
  var tabs = '';
  if(logged && hasRole()){
    tabs = '<div class="tabs">' +
      '<button class="tab-btn ' + (STATE.tab==='captura'?'active':'') + '" data-action="tab" data-tab="captura">📝 Captura</button>' +
      '<button class="tab-btn ' + (STATE.tab==='historial'?'active':'') + '" data-action="tab" data-tab="historial">📋 Registro</button>' +
      (isAdmin() ? '<button class="tab-btn ' + (STATE.tab==='dashboard'?'active':'') + '" data-action="tab" data-tab="dashboard">📊 Dashboard</button>' : '') +
    '</div>';
  }
  var logout = remote ? '<button class="logout-btn" data-action="logout" title="Cerrar sesión">Salir</button>' : '';
  return '' +
  '<div class="topbar' + (tabs ? '' : ' topbar-notabs') + '">' +
    TOPBAR_WAVES_SVG +
    '<div class="topbar-row" style="align-items:center;">' +
      '<div class="brand-badge"><img src="data:image/png;base64,'+BAKER_HUGHES_LOGO_B64+'" alt="Baker Hughes"></div>' +
      '<div class="title-block" style="flex:1;min-width:0;">' +
        '<h1>Matriz de seguimiento pozos</h1>' +
        '<p>' + sub + '</p>' +
      '</div>' +
      '<div class="conn-dot ' + connClass + '" title="' + connTitle + '"></div>' +
      logout +
    '</div>' +
    tabs +
  '</div>';
}

/* ---------- CAPTURA TAB ---------- */
function renderCaptura(){
  var out = '';
  var draft = loadDraft();
  if(draft && !STATE.draftDismissed && STATE.step===0 && !STATE.cliente){
    out += '<div class="banner banner-warn">⏳ Tienes un borrador sin enviar' + (draft.pozo? (' ('+esc(draft.pozo)+')'):'') + '.' +
      '<button data-action="restore-draft">Continuar</button>' +
      '<button data-action="discard-draft" style="margin-left:6px;">Descartar</button>' +
      '</div>';
  }
  out += renderStepper();
  if(STATE.step===0) out += renderStepCliente();
  else if(STATE.step===1) out += renderStepPozo();
  else if(STATE.step===2) out += renderStepDatos();
  else out += renderStepRevision();
  return out;
}

function renderStepper(){
  var labels = ['Cliente','Pozo','Datos','Revisión'];
  var html = '<div class="stepper">';
  labels.forEach(function(lab,i){
    var cls = i<STATE.step ? 'done' : (i===STATE.step ? 'active':'');
    html += '<div class="step-node ' + cls + '" data-action="goto-step" data-step="'+i+'">' +
      '<div class="step-circle">' + (i<STATE.step? '✓' : (i+1)) + '</div>' +
      '<div class="step-label">'+lab+'</div>' +
    '</div>';
    if(i<labels.length-1){ html += '<div class="step-line ' + (i<STATE.step?'done':'') + '"></div>'; }
  });
  html += '</div>';
  return html;
}

function renderStepCliente(){
  var html = '<div class="card"><h2>Selecciona el cliente</h2><p class="sub">El listado de pozos disponibles depende del cliente escogido.</p>';
  html += '<div class="grid-select">';
  CLIENTES.forEach(function(c){
    var n = (POZOS[c]||[]).length;
    html += '<div class="pick-card" data-action="pick-cliente" data-cliente="'+esc(c)+'">' +
      '<div class="pick-avatar" style="background:'+colorFor(c)+'">'+esc(initials(c))+'</div>' +
      '<div class="pick-name">'+esc(c)+'</div>' +
      '<div class="pick-meta">'+n+' pozo'+(n!==1?'s':'')+'</div>' +
    '</div>';
  });
  html += '</div></div>';
  return html;
}

function renderStepPozo(){
  var pozos = POZOS[STATE.cliente] || [];
  var filt = STATE.pozoFilter.trim().toLowerCase();
  if(filt) pozos = pozos.filter(function(p){ return p.toLowerCase().indexOf(filt)>=0; });
  var html = '<button class="back-link" data-action="goto-step" data-step="0">← Cambiar cliente</button>';
  html += '<div class="card">';
  html += '<div class="chip-row"><div class="chip">'+esc(STATE.cliente)+'</div></div>';
  html += '<h2>Selecciona el pozo</h2><p class="sub">Toca un pozo para continuar con la captura de datos.</p>';
  html += '<input class="search-box" placeholder="Buscar pozo…" id="pozo-search" value="'+esc(STATE.pozoFilter)+'">';
  html += '<div class="pozo-list">';
  if(pozos.length===0){ html += '<div class="empty-note">No se encontraron pozos.</div>'; }
  pozos.forEach(function(p){
    html += '<div class="pozo-item" data-action="pick-pozo" data-pozo="'+esc(p)+'">' +
      '<span class="name">🛢️ '+esc(p)+'</span><span class="arrow">›</span></div>';
  });
  html += '</div></div>';
  return html;
}

function fieldInputHtml(f){
  var val = STATE.values[f.id];
  val = (val===undefined||val===null)? '' : val;
  var isCalc = !!f.calc;
  var readonly = isCalc && !STATE.calcOverride[f.id];
  var type = f.type==='number' ? 'number' : (f.type==='date'?'date':'text');
  var extra = f.type==='number' ? ' step="any" inputmode="decimal"' : '';
  var lockBtn = '';
  if(isCalc){
    lockBtn = ' <button type="button" class="calc-badge" data-action="toggle-calc" data-field="'+f.id+'" style="cursor:pointer;border:none;">'+(readonly?'AUTO':'MANUAL')+'</button>';
  }
  return '<div class="field-row">' +
    '<label>'+esc(f.label)+lockBtn+'</label>' +
    '<input type="'+type+'"'+extra+(readonly?' readonly':'')+' data-field="'+f.id+'" value="'+esc(val)+'">' +
  '</div>';
}

function sectionProgress(sec){
  var flds = FIELDS_BY_SECTION[sec];
  var filled = flds.filter(function(f){ var v=STATE.values[f.id]; return v!==undefined && v!==null && v!==''; }).length;
  return {filled:filled, total:flds.length};
}

function renderStepDatos(){
  var html = '<button class="back-link" data-action="goto-step" data-step="1">← Cambiar pozo</button>';
  html += '<div class="chip-row">' +
    '<div class="chip">'+esc(STATE.cliente)+'</div>' +
    '<div class="chip">🛢️ '+esc(STATE.pozo)+'</div>' +
  '</div>';

  SECTIONS.forEach(function(sec){
    var meta = SECTION_META[sec];
    var prog = sectionProgress(sec);
    var pct = prog.total? Math.round(100*prog.filled/prog.total):0;
    var open = !!STATE.openSections[sec];
    html += '<div class="accordion-section '+(open?'open':'')+'" data-section="'+sec+'">';
    html += '<div class="accordion-head" data-action="toggle-section" data-section="'+sec+'">' +
      '<div class="left"><span class="icon">'+meta.icon+'</span><div><div class="name">'+meta.title+'</div>' +
      '<div class="count">'+prog.filled+' / '+prog.total+' campos</div></div></div>' +
      '<div style="display:flex;align-items:center;gap:10px;">' +
        '<div class="progress-pill"><div style="width:'+pct+'%"></div></div>' +
        '<span class="chevron">▾</span>' +
      '</div>' +
    '</div>';
    html += '<div class="accordion-body">';
    if(sec==='reo'){
      html += '<div class="formula-note">⚡ YS, PV y YP se calculan automáticamente a partir de R600, R300, R6 y R3. Toca AUTO/MANUAL para editar manualmente.</div>';
    }
    if(sec==='quimicos'){
      html += '<input class="search-box" placeholder="Buscar producto químico…" id="quim-search" value="'+esc(STATE.quimSearch)+'">';
    }
    html += '<div class="field-grid">';
    var flds = FIELDS_BY_SECTION[sec];
    if(sec==='quimicos' && STATE.quimSearch.trim()){
      var q = STATE.quimSearch.trim().toLowerCase();
      flds = flds.filter(function(f){ return f.label.toLowerCase().indexOf(q)>=0; });
    }
    flds.forEach(function(f){
      html += fieldInputHtml(f);
    });
    if(flds.length===0){ html += '<div class="empty-note">Sin resultados.</div>'; }
    html += '</div></div></div>';
  });

  html += '<div class="btn-row">' +
    '<button class="btn btn-ghost" data-action="goto-step" data-step="1">Atrás</button>' +
    '<button class="btn btn-primary" data-action="goto-review">Revisar registro →</button>' +
  '</div>';
  return html;
}

function renderStepRevision(){
  var html = '<button class="back-link" data-action="goto-step" data-step="2">← Editar datos</button>';
  html += '<div class="card">';
  html += '<h2>Revisión final</h2><p class="sub">Verifica los datos antes de enviar el registro.</p>';
  html += '<div class="chip-row"><div class="chip">'+esc(STATE.cliente)+'</div><div class="chip">🛢️ '+esc(STATE.pozo)+'</div>' +
    '<div class="chip">📅 '+fmtDate(STATE.values.fecha)+'</div></div>';

  SECTIONS.forEach(function(sec){
    var meta = SECTION_META[sec];
    var flds = FIELDS_BY_SECTION[sec].filter(function(f){
      var v = STATE.values[f.id]; return v!==undefined && v!==null && v!=='';
    });
    if(flds.length===0) return;
    html += '<div class="review-section"><h3>'+meta.icon+' '+meta.title+'</h3><div class="review-grid">';
    flds.forEach(function(f){
      html += '<div class="review-item"><span class="l">'+esc(f.label)+'</span><span class="v">'+esc(STATE.values[f.id])+'</span></div>';
    });
    html += '</div></div>';
  });

  var anyFilled = SECTIONS.some(function(sec){ return sectionProgress(sec).filled>0; });
  if(!anyFilled){ html += '<div class="empty-note">Aún no has diligenciado datos técnicos.</div>'; }

  html += '<div class="btn-row">' +
    '<button class="btn btn-ghost" data-action="goto-step" data-step="2">Editar</button>' +
    '<button class="btn btn-primary" id="submit-btn" data-action="submit">✔ Enviar registro</button>' +
  '</div>';
  html += '</div>';
  return html;
}

/* ---------- DASHBOARD TAB ---------- */
var DASH_CHARTS = {};

function getAllPozosFlat(){
  var out = [];
  CLIENTES.forEach(function(c){ (POZOS[c]||[]).forEach(function(p){ out.push({cliente:c, pozo:p}); }); });
  return out;
}
function dashPozoKey(cliente,pozo){ return cliente+'|||'+pozo; }
function normTxt(v){ return (v===undefined||v===null) ? '' : String(v).trim(); }
function getRecordsForDashPozo(){
  var d = STATE.dash;
  return STATE.hist.records.filter(function(r){
    var v = r.values||{};
    if(d.cliente && r.cliente!==d.cliente) return false;
    if(d.pozo && r.pozo!==d.pozo) return false;
    if(d.seccion && normTxt(v.hole_section)!==d.seccion) return false;
    if(d.depto && normTxt(v.departamento)!==d.depto) return false;
    if(d.from && (v.fecha||'') < d.from) return false;
    if(d.to && (v.fecha||'') > d.to) return false;
    return true;
  });
}
function distinctValues(field){
  var seen = {};
  STATE.hist.records.forEach(function(r){ var t = normTxt((r.values||{})[field]); if(t) seen[t]=1; });
  return Object.keys(seen).sort(function(a,b){ return a.localeCompare(b,'es',{numeric:true}); });
}
function optList(arr, sel){
  return arr.map(function(x){ return '<option value="'+esc(x)+'" '+(sel===x?'selected':'')+'>'+esc(x)+'</option>'; }).join('');
}
function num(v){ var n = parseFloat(v); return isNaN(n)? null : n; }

/* devuelve {min,max} aplicable a una profundidad dada, según la banda escalonada del plan */
function findBand(bandArr, md){
  if(md===null || md===undefined) return null;
  for(var i=bandArr.length-1;i>=0;i--){
    if(bandArr[i].md!==null && bandArr[i].md<=md && (bandArr[i].min!==null||bandArr[i].max!==null)){
      return {min:bandArr[i].min, max:bandArr[i].max};
    }
  }
  return null;
}

function renderDashboard(){
  var pozos = getAllPozosFlat();
  var recs = getRecordsForDashPozo();

  if(typeof Chart === 'undefined'){
    return '<div class="banner banner-warn">⚠️ No se pudo cargar la librería de gráficos (Chart.js). Revisa tu conexión a internet o si algún bloqueador de contenido está impidiendo cargar scripts de cdn.jsdelivr.net, y recarga la página.</div>';
  }

  // KPIs
  var total = recs.length;
  var mwOk=0, mwN=0, propOk=0, propN=0;
  var lastFecha = null;
  recs.forEach(function(r){
    var v = r.values||{};
    var md = num(v.hole_depth);
    var dens = num(v.density);
    if(md!==null && dens!==null){
      var band = findBand(PLAN_DATA.mw_curve.map(function(p){return {md:p.md,min:p.mw,max:p.mw};}), md);
      // banda de MW: usamos +-0.3 ppg de tolerancia sobre el valor recomendado
      if(band && band.min!==null){
        mwN++;
        if(dens >= band.min-0.3 && dens <= band.min+0.5) mwOk++;
      }
    }
    var pv = num(v[STATE.dash.prop]);
    if(md!==null && pv!==null){
      var pband = findBand(PLAN_DATA.propiedades[STATE.dash.prop], md);
      if(pband && (pband.min!==null || pband.max!==null)){
        propN++;
        var okMin = pband.min===null || pv>=pband.min;
        var okMax = pband.max===null || pv<=pband.max;
        if(okMin && okMax) propOk++;
      }
    }
    if(v.fecha && (!lastFecha || v.fecha>lastFecha)) lastFecha = v.fecha;
  });

  var html = '';
  html += '<div class="banner banner-ok" style="align-items:flex-start;">' +
    '<span>📊</span><div style="flex:1;">Dashboard basado en la matriz de plan de perforación (CLIA 46) comparado contra los registros del histórico. Usa los filtros para ver la comparación plan vs. real por sección, departamento, cliente, pozo o rango de fechas.</div></div>';

  var d = STATE.dash;
  var pozoOpts = d.cliente ? (POZOS[d.cliente]||[]) : pozos.map(function(p){ return p.pozo; });

  var hasDashFilters = d.cliente || d.pozo || d.seccion || d.depto || d.from || d.to;
  html += '<div class="filters-card dash-filters">' +
    '<label class="grow">Sección<select id="d-seccion"><option value="">Todas</option>'+optList(distinctValues('hole_section'), d.seccion)+'</select></label>' +
    '<label class="grow">Departamento<select id="d-depto"><option value="">Todos</option>'+optList(distinctValues('departamento'), d.depto)+'</select></label>' +
    '<label class="grow">Cliente<select id="d-cliente"><option value="">Todos</option>'+optList(CLIENTES, d.cliente)+'</select></label>' +
    '<label class="grow">Pozo<select id="d-pozo"><option value="">Todos</option>'+optList(pozoOpts, d.pozo)+'</select></label>' +

    '<label>Hasta<input type="date" id="d-to" value="'+esc(d.to)+'"></label>' +
    (hasDashFilters ? '<button class="btn btn-ghost dash-clear" data-action="dash-clear">✕ Limpiar filtros</button>' : '') +
  '</div>';

  html += '<div class="kpi-row">' +
    '<div class="kpi-card"><div class="val">'+total+'</div><div class="lbl">Registros analizados</div></div>' +
    '<div class="kpi-card"><div class="val">'+(mwN? Math.round(100*mwOk/mwN)+'%':'—')+'</div><div class="lbl">MW dentro de plan</div></div>' +
    '<div class="kpi-card"><div class="val">'+(propN? Math.round(100*propOk/propN)+'%':'—')+'</div><div class="lbl">'+esc((PLAN_DATA.propiedades_labels[STATE.dash.prop]||'').split(' ')[0])+' dentro de plan</div></div>' +
    '<div class="kpi-card"><div class="val" style="font-size:15px;">'+(lastFecha? fmtDate(lastFecha):'—')+'</div><div class="lbl">Último reporte</div></div>' +
  '</div>';

  // --- Chart 1: MW ---
  html += '<div class="card">' +
    '<h2>🧪 Peso del Lodo (MW) — Plan vs. Real</h2>' +
    '<p class="sub">Curva de MW recomendado según programa (línea) vs. densidad real reportada (puntos), por profundidad (MD ft).</p>' +
    '<div class="chart-wrap"><canvas id="chart-mw"></canvas></div>' +
    '<div class="legend-note"><span><span class="legend-dot" style="background:#33a67d;"></span>MW Plan</span><span><span class="legend-dot" style="background:#e0a53d;"></span>Densidad Real</span></div>' +
  '</div>';

  // --- Chart 2: Propiedades ---
  html += '<div class="card">' +
    '<h2>🔬 Propiedades Reológicas — Plan vs. Real</h2>' +
    '<p class="sub">Banda de plan (mín-máx) por profundidad vs. valores reales reportados.</p>' +
    '<div class="chip-select" id="chip-props">' +
    Object.keys(PLAN_DATA.propiedades).map(function(fid){
      return '<button class="chip-btn '+(STATE.dash.prop===fid?'active':'')+'" data-action="dash-prop" data-fid="'+fid+'">'+esc(PLAN_DATA.propiedades_labels[fid].split(' ')[0])+'</button>';
    }).join('') +
    '</div>' +
    '<div class="chart-wrap"><canvas id="chart-prop"></canvas></div>' +
    '<div class="legend-note"><span><span class="legend-dot" style="background:rgba(51,166,125,.35);"></span>Rango de plan</span><span><span class="legend-dot" style="background:#e0a53d;"></span>Real</span></div>' +
  '</div>';

  // --- Chart 3: Concentraciones ---
  html += '<div class="card">' +
    '<h2>🧴 Dosificación de Productos — Plan vs. Real</h2>' +
    '<p class="sub">Banda de plan (mín-máx, ppb) por profundidad vs. dosificación real reportada.</p>' +

      return '<button class="chip-btn '+(STATE.dash.prod===fid?'active':'')+'" data-action="dash-prod" data-fid="'+fid+'">'+esc(PLAN_DATA.concentraciones_labels[fid].split(' ')[0])+'</button>';

    '<div class="legend-note"><span><span class="legend-dot" style="background:rgba(51,166,125,.35);"></span>Rango de plan</span><span><span class="legend-dot" style="background:#e0a53d;"></span>Real</span></div>' +
  '</div>';

  return html;
}

function renderRecordCard(r){
  var v = r.values || {};
  var html = '<div class="record-card">';
  html += '<div class="record-top"><div><div class="pozo">🛢️ '+esc(r.pozo)+'</div><div class="cliente">'+esc(r.cliente)+'</div></div>' +
    '<div class="record-date">📅 '+fmtDate(v.fecha)+'</div></div>';
  html += '<div class="record-mini">' +
    miniField('Hole Section', v.hole_section) +
    miniField('Formación', v.formacion) +
    miniField('Densidad', v.density) +
    miniField('PV (cp)', v.pv_plastic_viscosity) +
    miniField('YP', v.yp_yield_point) +
    miniField('Costo/día', v.costo_total_diario ? ('$'+v.costo_total_diario):'') +
  '</div>';
  html += '<div class="record-actions">' +
    '<button class="btn btn-ghost" data-action="view-record" data-id="'+esc(r.id)+'">Ver detalle</button>' +
    (isAdmin() ? '<button class="btn btn-danger" data-action="delete-record" data-id="'+esc(r.id)+'">Eliminar</button>' : '') +
  '</div></div>';
  return html;
}
function miniField(label, val){
  return '<div><span class="l">'+esc(label)+'</span><span class="v">'+esc(val!==undefined&&val!==null&&val!==''?val:'—')+'</span></div>';
}

function getFilteredRecords(){
  var recs = STATE.hist.records.slice();
  var h = STATE.hist;
  if(h.filterCliente) recs = recs.filter(function(r){ return r.cliente===h.filterCliente; });
  if(h.filterPozo) recs = recs.filter(function(r){ return r.pozo===h.filterPozo; });
  if(h.from) recs = recs.filter(function(r){ return (r.values.fecha||'') >= h.from; });
  if(h.to) recs = recs.filter(function(r){ return (r.values.fecha||'') <= h.to; });
  if(h.search.trim()){
    var q = h.search.trim().toLowerCase();
    recs = recs.filter(function(r){
      var v=r.values;
      return (v.formacion||'').toLowerCase().indexOf(q)>=0 || (v.hole_section||'').toLowerCase().indexOf(q)>=0 ||
             r.pozo.toLowerCase().indexOf(q)>=0;
    });
  }
  recs.sort(function(a,b){ return (b.values.fecha||'').localeCompare(a.values.fecha||'') || (b.createdAt||0)-(a.createdAt||0); });
  return recs;
}

var HIST_SYNC = { busy:false, lastFull:0, maxCreated:null };
var PAGE_SIZE = 1000;            // máximo de filas que Supabase entrega por consulta
var FULL_RELOAD_MS = 5*60*1000;  // recarga completa cada 5 min (refleja eliminaciones de otros equipos)

function rowToRecord(row){
  return {id:row.id, cliente:row.cliente, pozo:row.pozo, values:row.data||{}, createdAt: new Date(row.created_at).getTime(), createdRaw: row.created_at};
}
function sortRecords(list){
  list.sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
  return list;
}
function updateMaxCreated(list){
  list.forEach(function(r){ if(r.createdRaw && (!HIST_SYNC.maxCreated || r.createdAt > new Date(HIST_SYNC.maxCreated).getTime())) HIST_SYNC.maxCreated = r.createdRaw; });
}
function syncError(err){
  console.warn('supabase error', err);
  showToast('Error de sincronización: '+err.message, 'err');
}

/* Carga TODOS los registros, paginando de a 1000 */
function loadAllRecords(){
  var all = [];
  function page(from){
    return supabase.from('registros').select('*')
      .order('created_at', {ascending:false}).order('id', {ascending:true})
      .range(from, from+PAGE_SIZE-1)
      .then(function(res){
        if(res.error) throw res.error;
        var rows = res.data||[];
        all = all.concat(rows.map(rowToRecord));
        if(rows.length===PAGE_SIZE) return page(from+PAGE_SIZE);
        return all;
      });
  }
  return page(0);
}

/* Trae solo los registros nuevos desde la última sincronización */
function loadNewRecords(){
  return supabase.from('registros').select('*')
    .gt('created_at', HIST_SYNC.maxCreated)
    .order('created_at', {ascending:false})
    .then(function(res){
      if(res.error) throw res.error;
      return (res.data||[]).map(rowToRecord);
    });
}

function subscribeHistorial(forceFull){
  if(!supabase || !STATE.user || HIST_SYNC.busy) return;
  var full = forceFull || !STATE.hist.loaded || !HIST_SYNC.maxCreated || (Date.now()-HIST_SYNC.lastFull) > FULL_RELOAD_MS;
  HIST_SYNC.busy = true;
  var job = full ? loadAllRecords() : loadNewRecords();
  job.then(function(recs){
    if(full){
      STATE.hist.records = sortRecords(recs);
      HIST_SYNC.lastFull = Date.now();
      HIST_SYNC.maxCreated = null;
      updateMaxCreated(recs);
    } else {
      if(recs.length===0) return;
      var known = {};
      STATE.hist.records.forEach(function(r){ known[r.id]=1; });
      var fresh = recs.filter(function(r){ return !known[r.id]; });
      if(fresh.length===0) return;
      STATE.hist.records = sortRecords(fresh.concat(STATE.hist.records));
      updateMaxCreated(fresh);
    }
    STATE.hist.loaded = true;
    if(STATE.tab==='historial' || STATE.tab==='dashboard') renderAll();
  }).catch(syncError).then(function(){ HIST_SYNC.busy = false; });
}

function loadLocalRecords(){
  try{
    var raw = localStorage.getItem('captura_pozos_local_records');
    return raw? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveLocalRecord(rec){
  var list = loadLocalRecords();
  list.unshift(rec);
  try{ localStorage.setItem('captura_pozos_local_records', JSON.stringify(list.slice(0,500))); }catch(e){}
}
function deleteLocalRecord(id){
  var list = loadLocalRecords().filter(function(r){ return r.id!==id; });
  try{ localStorage.setItem('captura_pozos_local_records', JSON.stringify(list)); }catch(e){}
}

function submitRecord(){
  if(!STATE.cliente || !STATE.pozo){ showToast('Selecciona cliente y pozo', 'err'); return; }
  var btn = document.getElementById('submit-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Enviando…'; }
  var payload = {
    cliente: STATE.cliente,
    pozo: STATE.pozo,
    values: JSON.parse(JSON.stringify(STATE.values)),
    createdAt: Date.now()
  };
  var id = slugRandom();

  function done(ok){
    clearDraft();
    if(ok){
      showToast('✔ Registro guardado correctamente', 'ok');
    }
    resetWizard();
    renderAll();
  }

  if(supabase){
    supabase.from('registros').insert({id:id, cliente:payload.cliente, pozo:payload.pozo, data:payload.values}).then(function(res){
      if(res.error){
        console.warn(res.error);
        showToast('No se pudo guardar en la nube, se guardó localmente', 'err');
        saveLocalRecord({id:id, cliente:payload.cliente, pozo:payload.pozo, values:payload.values, createdAt:payload.createdAt});
        STATE.hist.records = loadLocalRecords();
        done(true);
        return;
      }
      subscribeHistorial();
      done(true);
    });
  } else {
    saveLocalRecord({id:id, cliente:payload.cliente, pozo:payload.pozo, values:payload.values, createdAt:payload.createdAt});
    STATE.hist.records = loadLocalRecords();
    done(true);
  }
}

function deleteRecord(id){
  if(!isAdmin()){ showToast('No tienes permiso para eliminar registros', 'err'); return; }
  if(!confirm('¿Eliminar este registro? Esta acción no se puede deshacer.')) return;
  if(supabase){
    supabase.from('registros').delete().eq('id', id).then(function(res){
      if(res.error){
        showToast('No se pudo eliminar: '+res.error.message, 'err');
        return;
      }
      showToast('Registro eliminado', 'ok');
      STATE.hist.records = STATE.hist.records.filter(function(r){ return r.id!==id; });
      renderAll();
    });
  } else {
    deleteLocalRecord(id);
    STATE.hist.records = loadLocalRecords();
    showToast('Registro eliminado', 'ok');
    renderAll();
  }
}

/* ---------------- descarga estándar de navegador (funciona en cualquier hosting) ---------------- */
function triggerBrowserDownload(blob, filename){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
}

/* ---------------- export xlsx ---------------- */
function exportXlsx(){
  var recs = getFilteredRecords();
  if(recs.length===0){ showToast('No hay registros para exportar', 'err'); return; }
  if(typeof XLSX === 'undefined'){ showToast('Librería de exportación no disponible', 'err'); return; }
  var headers = ['Cliente','Pozo'].concat(FIELDS.map(function(f){ return f.label; }));
  var rows = [headers];
  recs.forEach(function(r){
    var row = [r.cliente, r.pozo];
    FIELDS.forEach(function(f){ row.push(r.values[f.id]!==undefined? r.values[f.id]:''); });
    rows.push(row);
  });
  var ws = XLSX.utils.aoa_to_sheet(rows);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Registros');
  var wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  var blob = new Blob([wbout], {type:'application/octet-stream'});
  var fname = 'registros_fluidos_'+todayISO()+'.xlsx';
  triggerBrowserDownload(blob, fname);
  showToast('Archivo exportado', 'ok');
}

/* ---------------- wizard flow ---------------- */
function resetWizard(){
  STATE.step=0; STATE.cliente=null; STATE.pozo=null; STATE.values={}; STATE.calcOverride={};
  STATE.openSections={ident:true}; STATE.pozoFilter=''; STATE.quimSearch=''; STATE.draftDismissed=false;
}

function restoreDraftState(){
  var d = loadDraft();
  if(!d) return;
  STATE.cliente = d.cliente; STATE.pozo = d.pozo; STATE.values = d.values||{}; STATE.step = d.step||2;
  if(STATE.step<2) STATE.step=2;
}

/* ---------------- events ---------------- */
function attachEvents(){
  ['login-email','login-pass'].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  });
  root.querySelectorAll('[data-action]').forEach(function(el){
    el.addEventListener('click', onAction);
  });
  var pozoSearch = document.getElementById('pozo-search');
  if(pozoSearch){
    pozoSearch.addEventListener('input', function(e){
      STATE.pozoFilter = e.target.value;
      renderAll();
      var el = document.getElementById('pozo-search'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });
  }
  var quimSearch = document.getElementById('quim-search');
  if(quimSearch){
    quimSearch.addEventListener('input', function(e){
      STATE.quimSearch = e.target.value;
      renderAll();
      var el = document.getElementById('quim-search'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });
  }
  [['d-seccion','seccion'],['d-depto','depto'],['d-cliente','cliente'],['d-pozo','pozo'],['d-from','from'],['d-to','to']].forEach(function(pair){
    var el = document.getElementById(pair[0]);
    if(!el) return;
    el.addEventListener('change', function(e){
      STATE.dash[pair[1]] = e.target.value || '';
      if(pair[1]==='cliente' && STATE.dash.pozo && (POZOS[STATE.dash.cliente]||[]).indexOf(STATE.dash.pozo)<0 && STATE.dash.cliente) STATE.dash.pozo='';
      renderAll();
    });
  });
  root.querySelectorAll('input[data-field]').forEach(function(el){
    el.addEventListener('input', function(e){
      var fid = e.target.getAttribute('data-field');
      STATE.values[fid] = e.target.value;
      if(['r600','r300','r200','r100','r6','r3'].indexOf(fid)>=0){
        recalc();
        // update calc fields inline without full re-render (preserve focus)
        ['ys_yield_stress','pv_plastic_viscosity','yp_yield_point'].forEach(function(cid){
          var inp = root.querySelector('input[data-field="'+cid+'"]');
          if(inp && !STATE.calcOverride[cid]) inp.value = (STATE.values[cid]!==undefined? STATE.values[cid]:'');
        });
        updateSectionProgressUI('reo');
      } else {
        updateSectionProgressUI(FIELD_BY_ID[fid] ? FIELD_BY_ID[fid].section : null);
      }
      saveDraft();
    });
  });
  ['f-cliente','f-pozo','f-from','f-to','f-search'].forEach(function(id){
    var el = document.getElementById(id);
    if(!el) return;
    var ev = (id==='f-search') ? 'input' : 'change';
    el.addEventListener(ev, function(e){
      if(id==='f-cliente'){ STATE.hist.filterCliente = e.target.value; STATE.hist.filterPozo=''; }
      if(id==='f-pozo'){ STATE.hist.filterPozo = e.target.value; }
      if(id==='f-from'){ STATE.hist.from = e.target.value; }
      if(id==='f-to'){ STATE.hist.to = e.target.value; }
      if(id==='f-search'){ STATE.hist.search = e.target.value; }
      STATE.hist.showN = 100;
      renderAll();
      if(id==='f-search'){ var el2=document.getElementById('f-search'); if(el2){el2.focus(); el2.setSelectionRange(el2.value.length,el2.value.length);} }
    });
  });
}

function updateSectionProgressUI(sec){
  if(!sec) return;
  var secEl = root.querySelector('.accordion-section[data-section="'+sec+'"]');
  if(!secEl) return;
  var prog = sectionProgress(sec);
  var pct = prog.total? Math.round(100*prog.filled/prog.total):0;
  var countEl = secEl.querySelector('.count');
  if(countEl) countEl.textContent = prog.filled+' / '+prog.total+' campos';
  var pillEl = secEl.querySelector('.progress-pill > div');
  if(pillEl) pillEl.style.width = pct+'%';
}

function onAction(e){
  var el = e.currentTarget;
  var action = el.getAttribute('data-action');
  switch(action){
    case 'tab':
      if(el.getAttribute('data-tab')==='dashboard' && !isAdmin()) return;
      STATE.tab = el.getAttribute('data-tab');
      renderAll();
      if((STATE.tab==='historial' || STATE.tab==='dashboard') && supabase) subscribeHistorial();
      break;
    case 'login':
      doLogin();
      break;
    case 'logout':
      doLogout();
      break;
    case 'dash-prop':
      STATE.dash.prop = el.getAttribute('data-fid');
      renderAll();
      break;
    case 'dash-clear':
      STATE.dash.cliente=''; STATE.dash.pozo=''; STATE.dash.seccion=''; STATE.dash.depto=''; STATE.dash.from=''; STATE.dash.to='';
      renderAll();
      break;
    case 'dash-prod':
      STATE.dash.prod = el.getAttribute('data-fid');
      renderAll();
      break;
    case 'goto-step':
      var target = parseInt(el.getAttribute('data-step'),10);
      if(target>0 && !STATE.cliente) return;
      if(target>1 && !STATE.pozo) return;
      STATE.step = target;
      renderAll();
      break;
    case 'pick-cliente':
      STATE.cliente = el.getAttribute('data-cliente');
      STATE.pozo = null;
      STATE.pozoFilter='';
      STATE.step = 1;
      renderAll();
      break;
    case 'pick-pozo':
      STATE.pozo = el.getAttribute('data-pozo');
      if(!STATE.values.fecha) STATE.values.fecha = todayISO();
      STATE.step = 2;
      saveDraft();
      renderAll();
      break;
    case 'toggle-section':
      var sec = el.getAttribute('data-section');
      STATE.openSections[sec] = !STATE.openSections[sec];
      renderAll();
      break;
    case 'toggle-calc':
      var fid = el.getAttribute('data-field');
      STATE.calcOverride[fid] = !STATE.calcOverride[fid];
      renderAll();
      break;
    case 'goto-review':
      STATE.step = 3;
      renderAll();
      window.scrollTo(0,0);
      break;
    case 'submit':
      submitRecord();
      break;
    case 'restore-draft':
      restoreDraftState();
      renderAll();
      break;
    case 'discard-draft':
      clearDraft();
      STATE.draftDismissed = true;
      renderAll();
      break;
    case 'export-xlsx':
      exportXlsx();
      break;
    case 'hist-more':
      STATE.hist.showN += 100;
      renderAll();
      break;
    case 'clear-filters':
      STATE.hist.showN = 100;
      STATE.hist.filterCliente=''; STATE.hist.filterPozo=''; STATE.hist.from=''; STATE.hist.to=''; STATE.hist.search='';
      renderAll();
      break;
    case 'view-record':
      var id = el.getAttribute('data-id');
      var rec = STATE.hist.records.find(function(r){ return r.id===id; });
      if(rec) showRecordModal(rec);
      break;
    case 'delete-record':
      deleteRecord(el.getAttribute('data-id'));
      break;
    case 'close-modal':
      closeModal();
      break;
  }
}
/* La ventana emergente vive en <body> (fuera de #root), por eso el cierre se
   maneja con un listener a nivel de documento. */
document.addEventListener('click', function(e){
  var t = e.target;
  if(!t) return;
  if(t.id==='modal-bg'){ closeModal(); return; }
  if(t.closest && t.closest('[data-action="close-modal"]')){ closeModal(); }
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape') closeModal();
});

/* ---------------- init ---------------- */
if(!supabase){
  STATE.hist.records = loadLocalRecords();
}
renderAll();
initCapabilities();
})();

</script>
